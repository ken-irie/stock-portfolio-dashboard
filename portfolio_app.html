<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資産ポートフォリオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- app bar -->
  <div class="appbar">
    <div class="brand">資産<span class="accent">ポートフォリオ</span></div>
    <span id="src" class="src">CSV未読み込み</span>
    <div class="spacer"></div>
    <label class="tbtn load" title="SBI・楽天のCSVを読み込み（複数選択可）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-4 4M12 4l4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      CSV読込
      <input type="file" id="file" accept=".csv" multiple hidden>
    </label>
    <button class="tbtn reset" id="reset" title="読み込んだデータを消去">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>
      リセット
    </button>
  </div>

  <!-- section header -->
  <div class="sec-head">資産ポートフォリオ (全て) <span class="accent">評価額順 [降順]</span></div>

  <!-- controls -->
  <div class="controls">
    <div class="seg">
      <button class="on">個別</button>
      <button>証券会社</button>
      <button>セクター</button>
      <button>景気影響</button>
      <button>口座</button>
    </div>
    <button class="treemap-btn">ツリーマップ</button>
    <div class="spacer"></div>
    <div class="filters">
      <button class="fpill on" data-cat="all">全て</button>
      <button class="fpill" data-cat="jp">日本</button>
      <button class="fpill" data-cat="us">米国</button>
      <button class="fpill" data-cat="fund">投信</button>
      <button class="fpill" data-cat="crypto">暗号</button>
    </div>
  </div>

  <!-- main grid -->
  <div class="grid">

    <!-- left: donut -->
    <div class="card">
      <div class="card-title">ポートフォリオ構成 <small id="chartMode">ドーナツ / 評価額ベース</small></div>
      <div class="donut-wrap">
        <svg class="donut" id="donut" viewBox="0 0 520 440"></svg>
      </div>
      <div class="slider-row">
        <span class="cap" id="othCap">[その他]にまとめる基準：2.0%以下</span>
        <span>0%</span><input type="range" id="othRange" min="0" max="20" step="0.5" value="2"><span>20%</span>
      </div>
    </div>

    <!-- right: summary + list -->
    <div class="card">
      <div class="summary" id="summary"></div>
      <div class="card-title" id="listTitle">保有銘柄一覧 <small id="cnt"></small></div>
      <div id="list"></div>
    </div>

  </div>

  <!-- chart hover tooltip -->
  <div id="tip"></div>

  <!-- asset history -->
  <div class="hist-wrap">
    <div class="card">
      <div class="card-title">
        <span>資産推移 <small id="histInfo"></small></span>
        <button class="hist-clear" id="histClear" title="推移の記録をすべて削除">履歴クリア</button>
      </div>
      <div class="hist-stat">
        <span class="hd" id="hDate">–</span>
        <span class="hl">資産残高</span><b id="hTotal">–</b>
        <span class="hl">評価損益</span><b id="hPL">–</b><b id="hPLp"></b>
      </div>
      <div class="hist-ctrl">
        <div class="hseg">
          <button data-r="3">直近3ヶ月</button>
          <button data-r="6">直近半年</button>
          <button data-r="12">直近1年</button>
          <button data-r="0" class="on">全期間</button>
        </div>
        <span class="hrange" id="hRange"></span>
      </div>
      <div class="hist-body">
        <svg id="histSvg" viewBox="0 0 1040 320"></svg>
      </div>
    </div>
  </div>

<script src="sectors.js"></script>
<script src="app.js"></script>
</body>
</html>
